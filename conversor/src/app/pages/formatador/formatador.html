<div class="min-h-screen {{fundo}} flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-lg {{cor_form}} rounded-2xl shadow-lg border border-gray-200 p-8">

    <!-- Cabeçalho -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
            d="M12 16V4m0 0L7 9m5-5 5 5M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4" />
        </svg>
      </div>

      <h1 class="text-2xl font-bold {{titulo}}">
        Formatador de arquivos
      </h1>

      <p class="text-gray-500 mt-2">
        Envie seu arquivo e escolha formatar para começar.
      </p>
    </div>


    <div class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-blue-500 transition">
      <input type="file" id="arquivo" (change)="onFileSelected($event)" class="block w-full text-sm text-gray-600
          file:mr-4 file:py-2.5 file:px-4
          file:rounded-lg file:border-0
          file:bg-blue-50 file:text-blue-700
          file:font-semibold hover:file:bg-blue-100
          cursor-pointer" />

      <p class="text-xs text-gray-400 mt-4 cursor-pointer">
        Selecione o arquivo que deseja converter.
      </p>
    </div>


    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-6">


      <div>
        <label for="entrada" class="block text-sm font-semibold text-gray-700 mb-2">
          Formato original
        </label>

        <select id="entrada" name="entrada" [(ngModel)]="tipoOriginal" class="w-full cursor-pointer px-4 py-3 bg-white border border-gray-300 rounded-xl
             text-gray-700 outline-none focus:ring-2 focus:ring-blue-500
             focus:border-blue-500 transition">
          <option value="" disabled selected>De</option>
          <option value="png">PNG</option>
          <option value="jpeg">JPEG</option>
          <option value="pdf">PDF</option>
          <option value="docx">DOCX</option>
        </select>
      </div>


      <div>
        <label for="saida" class="block text-sm font-semibold text-gray-700 mb-2">
          Formato de saída
        </label>

        <select id="saida" name="saida" [(ngModel)]="tipoDesejado" class="w-full cursor-pointer px-4 py-3 bg-white border border-gray-300 rounded-xl
             text-gray-700 outline-none focus:ring-2 focus:ring-blue-500
             focus:border-blue-500 transition">
          <option value="" disabled selected>Para</option>
          <option value="png">PNG</option>
          <option value="jpeg">JPEG</option>
          <option value="pdf">PDF</option>
          <option value="docx">DOCX</option>
        </select>
      </div>

    </div>

    <button (click)="enviarArquivo()" type="button" class="w-full cursor-pointer mt-6 bg-blue-600 text-white font-semibold
        py-3 rounded-xl hover:bg-blue-700
        active:scale-[0.98] transition">
      Formatar arquivo
    </button>
    
      @if(mensagemStatus() != ''){
        <div class="w-full mt-6 p-4 {{corAviso()}} text-white font-semibold py-3 rounded-xl">
      {{mensagemStatus()}}
</div>
      }




    <p class="text-center text-sm text-gray-400 mt-4">
      Os formatos disponíveis dependem do conversor.
    </p>

  </div>
</div>
